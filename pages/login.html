<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Royal Pay</title>
  
  <link rel="stylesheet" href="../Css/global.css">
  <link rel="stylesheet" href="../Css/login.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="auth-page">

  <!-- Header -->
  <header class="auth-header">
    <div class="auth-brand">Royal Pay</div>
  </header>

  <!-- Login Container -->
  <main class="auth-container">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p>Access your premium financial dashboard</p>

      <form id="loginForm" class="auth-form">
        <div class="input-group">
          <label for="email">Email Address</label>
          <div class="input-icon-wrapper">
            <i class="bi bi-envelope"></i>
            <input type="email" id="email" class="input-field" placeholder="name@company.com" required>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password <a href="#">Forgot Password?</a></label>
          <div class="input-icon-wrapper">
            <i class="bi bi-lock"></i>
            <input type="password" id="password" class="input-field" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
          </div>
        </div>

        <button type="submit" class="btn-auth-primary" id="loginBtn">Sign In to Royal Pay</button>
      </form>
      
      <div id="authError" style="color: var(--danger); font-size: 0.85rem; margin-top: 16px; display: none;"></div>

      <div class="auth-divider">OR CONTINUE WITH</div>

      <div class="social-grid">
        <button type="button" class="btn-social" id="googleBtn">
          <i class="bi bi-google"></i> Google
        </button>
        <button type="button" class="btn-social">
          <i class="bi bi-github"></i> GitHub
        </button>
      </div>

      <div class="auth-footer-text">
        New to Royal Pay? <a href="./signup.html">Create an account</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="auth-footer">
    <div class="footer-brand-small">Royal Pay</div>
    <div class="footer-copy">&copy; 2024 Royal Pay. Banking Reimagined.</div>
    <div class="auth-footer-links">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Security</a>
      <a href="#">Contact</a>
    </div>
  </footer>

  <!-- Firebase Auth Logic -->
  <script type="module" src="../Js/auth.js"></script>
</body>
</html>

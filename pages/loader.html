<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Pay — Loading</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    :root {
      --purple-950: rgb(25, 0, 48);
      --purple-900: rgb(36, 0, 60);
      --purple-700: rgb(82, 25, 135);
      --purple-500: rgb(128, 63, 198);
      --gold: rgb(239, 190, 89);
      --mint: rgb(92, 219, 179);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--purple-950);
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── Noise texture overlay ── */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }

    /* ── Ambient glow blobs ── */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: blobDrift 8s ease-in-out infinite alternate;
    }

    .blob-one {
      width: 520px;
      height: 520px;
      top: -160px;
      left: -120px;
      background: radial-gradient(circle, rgba(128, 63, 198, 0.28), transparent 70%);
      animation-delay: 0s;
    }

    .blob-two {
      width: 420px;
      height: 420px;
      bottom: -100px;
      right: -80px;
      background: radial-gradient(circle, rgba(92, 219, 179, 0.18), transparent 70%);
      animation-delay: -4s;
    }

    @keyframes blobDrift {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(30px, 20px) scale(1.06);
      }
    }

    /* ── Stage ── */
    .loader-stage {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      animation: stageIn 0.7s ease both;
    }

    @keyframes stageIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ── Logo ── */
    .loader-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 28px;
      animation: logoBounce 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }

    .loader-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes logoBounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-16px);
      }
    }

    /* ── Spinner ── */
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(128, 63, 198, 0.18);
      border-top-color: rgb(128, 63, 198);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 24px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Text ── */
    .loader-text {
      color: rgba(241, 240, 245, 0.64);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-align: center;
      max-width: 240px;
      line-height: 1.6;
    }

    .loader-text strong {
      color: rgb(241, 240, 245);
      font-weight: 700;
      display: block;
      margin-bottom: 4px;
    }

    /* ── Progress indicator ── */
    .progress-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 20px;
    }

    .progress-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(128, 63, 198, 0.3);
      animation: dotPulse 1.2s ease-in-out infinite;
    }

    .progress-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .progress-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dotPulse {
      0%, 100% {
        background: rgba(128, 63, 198, 0.3);
        transform: scale(1);
      }

      50% {
        background: rgb(128, 63, 198);
        transform: scale(1.4);
      }
    }
  </style>
</head>

<body>
  <!-- ── Ambient blobs ── -->
  <div class="blob blob-one" aria-hidden="true"></div>
  <div class="blob blob-two" aria-hidden="true"></div>

  <!-- ── Loader stage ── -->
  <div class="loader-stage">
    <div class="loader-logo">
      <img src="../Images/Logo/high-resolution-color-logo (1).png" alt="Royal Pay" />
    </div>

    <div class="spinner" aria-label="Loading"></div>

    <div class="loader-text">
      <strong>Setting up your account</strong>
      <span>Preparing your dashboard...</span>
    </div>

    <div class="progress-dots">
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
    </div>
  </div>

  <script>
    // Auto-redirect to dashboard after 2 seconds
    setTimeout(() => {
      window.location.href = "./dashboard.html";
    }, 2000);
  </script>
</body>

</html>
